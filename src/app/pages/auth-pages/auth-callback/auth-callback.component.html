<app-auth-page-layout>
  <div class="flex flex-col items-center justify-center flex-1 w-full max-w-md gap-4 pt-10 mx-auto text-center">
    @if (!errorMessage) {
    <p class="text-sm text-gray-500 dark:text-gray-400">Signing you in…</p>
    } @else {
    <app-alert variant="error" title="Sign-in failed" [message]="errorMessage" />
    <a
      routerLink="/signin"
      class="text-sm font-medium text-brand-500 hover:text-brand-600 dark:text-brand-400"
    >
      Back to sign in
    </a>
    }
  </div>
</app-auth-page-layout>
